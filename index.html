<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 할 일</title>
  <style>
    :root {
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --surface: rgba(255, 255, 255, 0.92);
      --accent: #e85d3f;
      --accent-dark: #c9432a;
      --soft-accent: #fff0eb;
      --shadow: 0 24px 70px rgba(75, 53, 39, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      background:
        radial-gradient(circle at 12% 14%, rgba(255, 199, 159, 0.58), transparent 28%),
        radial-gradient(circle at 90% 88%, rgba(185, 222, 207, 0.68), transparent 30%),
        #f8f5ef;
    }

    .page {
      width: min(100% - 32px, 680px);
      margin: 0 auto;
      padding: 72px 0 48px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent-dark);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 8vw, 4.5rem);
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .intro {
      margin: 18px 0 30px;
      color: var(--muted);
      font-size: 1rem;
    }

    .todo-panel {
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .add-form {
      display: flex;
      gap: 10px;
      padding: 20px;
      border-bottom: 1px solid var(--line);
    }

    .add-form input {
      min-width: 0;
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .add-form input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(232, 93, 63, 0.12);
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    .add-button {
      flex: 0 0 auto;
      border-radius: 12px;
      padding: 0 20px;
      color: #fff;
      background: var(--accent);
      font-weight: 700;
      transition: background 160ms ease, transform 160ms ease;
    }

    .add-button:hover { background: var(--accent-dark); }
    .add-button:active { transform: translateY(1px); }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px 10px;
    }

    .list-title, .count {
      margin: 0;
      font-size: 0.86rem;
      font-weight: 800;
    }

    .count { color: var(--muted); }

    .todo-list {
      list-style: none;
      margin: 0;
      padding: 0 20px 20px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      border-top: 1px solid var(--line);
    }

    .todo-item label {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }

    .todo-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .todo-text {
      overflow-wrap: anywhere;
      font-size: 0.98rem;
      transition: color 160ms ease;
    }

    .todo-item.completed .todo-text {
      color: #9ca3af;
      text-decoration: line-through;
      text-decoration-thickness: 2px;
    }

    .delete-button {
      flex: 0 0 auto;
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--muted);
      background: transparent;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .delete-button:hover {
      color: var(--accent-dark);
      background: var(--soft-accent);
    }

    .empty-state {
      padding: 30px 20px 34px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state p { margin: 0; }

    @media (max-width: 480px) {
      .page { padding-top: 44px; }
      .add-form { flex-direction: column; }
      .add-button { min-height: 48px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">A little progress, every day</p>
    <h1>오늘의 할 일</h1>
    <p class="intro">해야 할 일을 적고, 하나씩 가볍게 끝내보세요.</p>

    <section class="todo-panel" aria-labelledby="list-heading">
      <form class="add-form" id="todo-form">
        <label for="todo-input" class="sr-only" hidden>할 일 입력</label>
        <input id="todo-input" type="text" placeholder="새로운 할 일을 입력하세요" autocomplete="off" maxlength="120" required>
        <button class="add-button" type="submit">추가하기</button>
      </form>

      <div class="list-header">
        <h2 class="list-title" id="list-heading">할 일 목록</h2>
        <p class="count" id="todo-count">0개</p>
      </div>

      <ul class="todo-list" id="todo-list"></ul>
      <div class="empty-state" id="empty-state">
        <p>아직 등록된 할 일이 없어요.</p>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const count = document.getElementById('todo-count');
    const emptyState = document.getElementById('empty-state');

    function updateSummary() {
      const items = list.querySelectorAll('.todo-item');
      const remaining = list.querySelectorAll('.todo-item:not(.completed)').length;
      count.textContent = `${remaining}개 남음`;
      emptyState.hidden = items.length > 0;
    }

    function addTodo(text) {
      const item = document.createElement('li');
      item.className = 'todo-item';

      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.setAttribute('aria-label', `${text} 완료 처리`);

      const textElement = document.createElement('span');
      textElement.className = 'todo-text';
      textElement.textContent = text;

      const deleteButton = document.createElement('button');
      deleteButton.className = 'delete-button';
      deleteButton.type = 'button';
      deleteButton.setAttribute('aria-label', `${text} 삭제`);
      deleteButton.textContent = '삭제';

      label.append(checkbox, textElement);
      item.append(label, deleteButton);
      list.appendChild(item);
      updateSummary();
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addTodo(text);
      input.value = '';
      input.focus();
    });

    list.addEventListener('change', (event) => {
      if (!event.target.matches('input[type="checkbox"]')) return;
      event.target.closest('.todo-item').classList.toggle('completed', event.target.checked);
      updateSummary();
    });

    list.addEventListener('click', (event) => {
      if (!event.target.matches('.delete-button')) return;
      event.target.closest('.todo-item').remove();
      updateSummary();
    });

    updateSummary();
  </script>
</body>
</html>
